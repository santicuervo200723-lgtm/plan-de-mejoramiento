<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guía de estilo — ZD.TechLab</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/estilos.css"></head>
<body><main class="panel__contenido"><h1>Componentes (5 estados: normal, hover, focus-visible, activo, deshabilitado)</h1>
<h2>Botones</h2><button class="boton">Primario</button> <button class="boton boton--sec">Secundario</button> <button class="boton boton--peligro">Peligro</button> <button class="boton" disabled>Deshabilitado</button>
<h2>Campos</h2><label>Nombre<input required placeholder="Mín. 3 caracteres"></label><p class="error">Mensaje de error junto al campo (no alert).</p>
<h2>Alerta</h2><p class="alerta-error" role="alert">Error · credenciales inválidas</p>
<h2>Tabla</h2><table><caption>Productos</caption><thead><tr><th>Producto</th><th>Precio</th></tr></thead><tbody><tr><td>Teclado</td><td>$ 120.000</td></tr></tbody></table>
</main></body></html>
